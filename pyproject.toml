[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name        = "electrickiwi-api"
version     = "0.10.1"
license     = "GPL-3.0-only"
authors     = [
    { name = "Michael Arthur", email = "michael@jumblesoft.co.nz" },
]
description = "Async Python client for the Electric Kiwi API"
readme      = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.8.1",
]

[project.urls]
Homepage    = "https://github.com/mikey0000/EK-API"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7",
    "bumpver>=2024.1130",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.bumpver]
current_version = "0.10.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version     = "{version}"']
"src/electrickiwi_api/__init__.py" = ["{version}"]
"README.md" = ['\[SemVer {version}\]', 'img.shields.io/static/v1.svg?label=SemVer&message={version}&color=blue']
